 <!-- notes -->
 <text x="380" y="285" fill="#808080" font-family="Roboto Condensed" font-size="13px" text-anchor="middle"><tspan>Two channels: polarization combine (c1,c2,c3) applied per bin in the same multiply</tspan><tspan x="380" dy="15">&#8594; baseb_raw (main) + baseb_raw_orthog.   mixer_mode 2: time-domain FIR instead.</tspan></text>
