 <text x="85" y="140" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan x="85">fft3 bins</tspan><tspan x="85" dy="15">(around 0 Hz)</tspan></text>

 <!-- top path: audio filter -->
