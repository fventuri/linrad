 <text x="485" y="221" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>inverse FFT</tspan></text>
 <text x="675" y="214" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan x="675">carrier</tspan><tspan x="675" dy="15">(coh CW / AM)</tspan></text>

