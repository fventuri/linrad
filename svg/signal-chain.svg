 <!-- buffer labels on the arrows -->
 <text x="545" y="78"  fill="#000000" font-family="Roboto Condensed" font-size="14px"><tspan x="545">timf1</tspan><tspan x="545" dy="15" fill="#808080">raw I/Q, 1&#8211;2 RF ch</tspan></text>
 <text x="545" y="160" fill="#000000" font-family="Roboto Condensed" font-size="14px"><tspan x="545">fft1</tspan><tspan x="545" dy="15" fill="#808080">spectrum / waterfall</tspan></text>
 <text x="545" y="250" fill="#808080" font-family="Roboto Condensed" font-size="14px"><tspan>two interleaved slots</tspan></text>
 <text x="545" y="324" fill="#000000" font-family="Roboto Condensed" font-size="14px"><tspan x="545">timf2</tspan><tspan x="545" dy="15" fill="#808080">impulse noise removed</tspan></text>
 <text x="545" y="414" fill="#000000" font-family="Roboto Condensed" font-size="14px"><tspan x="545">fft2</tspan><tspan x="545" dy="15" fill="#808080">fine resolution</tspan></text>
 <text x="545" y="496" fill="#000000" font-family="Roboto Condensed" font-size="14px"><tspan x="545">timf3</tspan><tspan x="545" dy="15" fill="#808080">tuned &amp; decimated</tspan></text>
 <text x="545" y="578" fill="#000000" font-family="Roboto Condensed" font-size="14px"><tspan x="545">baseb</tspan><tspan x="545" dy="15" fill="#808080">complex baseband</tspan></text>
 <text x="545" y="660" fill="#000000" font-family="Roboto Condensed" font-size="14px"><tspan x="545">daout</tspan><tspan x="545" dy="15" fill="#808080">audio to D/A</tspan></text>

