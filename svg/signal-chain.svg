 <!-- box labels -->
 <text x="380" y="46"  fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>Input &#8212; A/D &#183; network &#183; file</tspan></text>
 <text x="380" y="128" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>First FFT</tspan></text>
 <text x="380" y="197" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan x="380">Strong / weak split</tspan><tspan x="380" dy="15" fill="#808080">(liminfo)</tspan></text>
 <text x="380" y="279" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan x="380">Back FFT &#8594; timf2</tspan><tspan x="380" dy="15" font-weight="bold">Noise blanker</tspan></text>
 <text x="380" y="374" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>Second FFT &#8594; AFC / spur removal</tspan></text>
 <text x="380" y="456" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>First mixer &#8212; tune + decimate</tspan></text>
 <text x="380" y="525" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan x="380">Third FFT + second mixer</tspan><tspan x="380" dy="15" font-weight="bold">baseband filter + adaptive polarization</tspan></text>
 <text x="380" y="620" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>Demod &#183; AGC &#183; BFO &#183; resample</tspan></text>
 <text x="380" y="702" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>D/A output</tspan></text>

