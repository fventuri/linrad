 <text x="545" y="150" fill="#808080" font-family="Roboto Condensed" font-size="13px"><tspan x="545">liminfo &lt; 0: strong</tspan><tspan x="545" dy="15">== 0: weak</tspan><tspan x="545" dy="15">&gt; 0: strong &#215; factor</tspan></text>
 <text x="545" y="320" fill="#808080" font-family="Roboto Condensed" font-size="13px"><tspan x="545">+ per-sample power</tspan><tspan x="545" dy="15">&#8594; timf2_pwr[]</tspan></text>
