 <text x="380" y="60"  fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>fft1 spectrum (complex, per bin)</tspan></text>
 <text x="380" y="155" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan x="380">Route each bin by liminfo[]</tspan><tspan x="380" dy="15">into strong slot (limited) &#183; weak slot</tspan></text>
 <text x="380" y="272" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>Dual back-FFT &#8212; both slots, one pass</tspan></text>
 <text x="380" y="367" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan x="380">timf2, per sample:</tspan><tspan x="380" dy="15">[ weak (I,Q) | strong (I,Q) ]</tspan></text>
 <text x="205" y="481" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>weak part &#8594; noise blanker</tspan></text>
 <text x="555" y="481" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>weak + strong summed &#8594; 2nd FFT</tspan></text>

