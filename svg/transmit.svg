 <text x="380" y="49"  fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>Microphone &#8594; mictimf</tspan></text>
 <text x="380" y="117" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>FFT 1: window &#183; frequency-shift &#183; filter &#8594; micfft (passband @ bin 0)</tspan></text>
 <text x="380" y="185" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>Frequency-domain muting  (step 2)</tspan></text>
 <text x="380" y="253" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>IFFT 2 &#8594; cliptimf  &#183;  AGC + clip + mute  (step 4)</tspan></text>
 <text x="380" y="321" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>FFT 3 &#8594; clipfft  &#183;  band-limit filter  (step 5)</tspan></text>
 <text x="380" y="389" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>IFFT 4 &#8594; alctimf  &#183;  ALC detector (fast attack / slow release)  (step 6)</tspan></text>
 <text x="380" y="457" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>Apply ALC &#8212; peak power &#8804; 1.00  (step 7)</tspan></text>
 <text x="380" y="525" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>Resample &#8594; FFT 5 / IFFT 6 clean &#8594; tx_resamp  (step 8)</tspan></text>
 <text x="380" y="593" fill="#000000" font-family="Roboto Condensed" font-size="14px" text-anchor="middle"><tspan>Output soundcard (I/Q)</tspan></text>

